# Netlify sirve las páginas de `public/` desde su red y manda todo lo que
# empieza con /api/ a una sola función (netlify/functions/api.js).

[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'sin build: el front es HTML/CSS/JS a mano'"

[functions]
  node_bundler = "esbuild"
  # El paquete de la base viaja tal cual, sin empaquetar, y se carga recién al
  # ejecutarse: adentro tiene binarios `.node` que el empaquetador no sabe
  # procesar y harían fallar el build.
  external_node_modules = ["@libsql/client"]
  included_files = ["node_modules/@libsql/client/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
