<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar consulta</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <div class="grilla" style="grid-template-columns:minmax(0,2fr) minmax(280px,1fr);align-items:start">

    <section class="tarjeta">
      <header>
        <h1>Carga detallada</h1>
        <p>para cuando hace falta anotar socio, derivación u observaciones ·
           guardá con <kbd>Ctrl</kbd>+<kbd>Enter</kbd> ·
           <a href="/rapido.html">volver a atención rápida</a></p>
      </header>

      <div id="frecuentes" class="fila" style="gap:.35rem;margin-bottom:.9rem"></div>

      <form id="form">
        <div class="fila">
          <div class="campo"><label for="canal">Canal de contacto *</label>
            <select id="canal" required></select></div>
          <div class="campo"><label for="puesto">Puesto</label>
            <select id="puesto"></select></div>
          <div class="campo corto"><label for="prioridad">Prioridad</label>
            <select id="prioridad"></select></div>
        </div>

        <div class="fila" style="margin-top:.6rem">
          <div class="campo"><label for="sector">Sector consultado *</label>
            <select id="sector" required></select></div>
          <div class="campo"><label for="motivo">Motivo</label>
            <select id="motivo"></select></div>
        </div>

        <div class="fila" style="margin-top:.6rem">
          <div class="campo corto"><label for="socio_nro">N° de socio</label>
            <input id="socio_nro" inputmode="numeric" autocomplete="off"></div>
          <div class="campo"><label for="socio_nombre">Nombre del socio</label>
            <input id="socio_nombre" autocomplete="off"></div>
          <div class="campo"><label for="contacto">Teléfono / email</label>
            <input id="contacto" autocomplete="off"></div>
          <div class="campo corto"><label for="localidad">Localidad</label>
            <select id="localidad"></select></div>
        </div>

        <div class="fila" style="margin-top:.6rem">
          <div class="campo"><label for="estado">Resultado *</label>
            <select id="estado"></select></div>
          <div class="campo corto"><label for="reclamo_nro">N° de reclamo / OT</label>
            <input id="reclamo_nro" autocomplete="off"></div>
          <div class="campo corto"><label for="duracion">Duración (min)</label>
            <input id="duracion" type="number" min="0" step="1" value="0"></div>
          <div class="campo corto">
            <label>Cronómetro</label>
            <button type="button" id="crono" style="width:100%;justify-content:center">▶ Iniciar</button>
          </div>
        </div>

        <div style="margin-top:.6rem">
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" placeholder="Detalle de lo consultado, qué se le informó al socio, a quién se derivó…"></textarea>
        </div>

        <div class="fila" style="margin-top:.7rem;align-items:center">
          <label style="display:flex;gap:.4rem;align-items:center;font-size:.85rem;margin:0">
            <input type="checkbox" id="primer_contacto" checked style="width:auto"> Resuelta en el primer contacto
          </label>
          <label style="display:flex;gap:.4rem;align-items:center;font-size:.85rem;margin:0">
            <input type="checkbox" id="generar_encuesta" style="width:auto"> Generar encuesta de satisfacción
          </label>
          <span style="flex:1"></span>
          <button type="button" id="limpiar">Limpiar</button>
          <button type="submit" class="primario">Guardar consulta</button>
        </div>
        <p class="aviso" id="aviso"></p>
        <div id="link-encuesta" class="oculto"></div>
      </form>
    </section>

    <aside class="grilla" style="gap:1rem">
      <div class="tarjeta">
        <header><h2>Hoy</h2></header>
        <div class="kpis" id="kpis-hoy"></div>
      </div>
      <div class="tarjeta">
        <header><h2>Últimas cargadas</h2><p id="mis-total"></p></header>
        <div id="ultimas" class="tabla-scroll"></div>
      </div>
    </aside>
  </div>
</main>

<script type="module" src="/js/carga.js"></script>
</body>
</html>
