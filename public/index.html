<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultas y encuestas</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- La barra y el contenido se arman al entrar; antes no hay nada que mostrar -->
<header class="barra oculto" id="barra"></header>
<div id="vista"></div>

<!-- ------------------------------------------------------------ ingreso -->
<div class="ingreso oculto" id="acceso">
  <form class="tarjeta acceso" id="forma" novalidate>
    <div class="marca-acceso">
      <img src="/img/logo.png" alt="" class="logo-acceso" onerror="this.remove()">
      <div class="sello" id="sello">C</div>
      <h1 id="titulo">Cooperativa</h1>
      <p>Consultas de mesa de informes y call center</p>
    </div>

    <div class="campo-acceso">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" required>
    </div>
    <div class="campo-acceso">
      <label for="clave">Clave</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required>
    </div>

    <button class="primario" type="submit">Ingresar</button>
    <p class="solo-lectores" id="aviso-acceso" role="status" aria-live="polite"></p>
    <p class="ayuda">Si olvidaste tu clave, pedísela al administrador.</p>
  </form>
</div>

<div class="bienvenida oculto" id="bienvenida">
  <div>
    <img src="/img/logo.png" alt="" class="logo-bienvenida" onerror="this.remove()">
    <div class="saludo">Te damos la bienvenida</div>
    <div class="nombre" id="nombre-bienvenida"></div>
    <div class="pie">Preparando tu pantalla…</div>
  </div>
</div>

<dialog id="clave-dialogo">
  <form class="cuerpo" id="forma-clave">
    <h2>Mi clave</h2>
    <p class="solo-lectura">La primera vez conviene cambiar la que te dieron.</p>
    <div class="campo-acceso" style="margin-top:.8rem">
      <label for="k-actual">Clave actual</label>
      <input id="k-actual" type="password" autocomplete="current-password" required>
    </div>
    <div class="campo-acceso">
      <label for="k-nueva">Clave nueva</label>
      <input id="k-nueva" type="password" autocomplete="new-password" required>
    </div>
    <p class="aviso" id="clave-aviso"></p>
    <div class="fila" style="justify-content:flex-end;margin-top:.6rem">
      <button type="button" id="clave-cerrar">Cerrar</button>
      <button class="primario">Cambiar</button>
    </div>
  </form>
</dialog>

<canvas id="polvo" class="oculto"></canvas>

<script type="module" src="/js/app.js"></script>
</body>
</html>
